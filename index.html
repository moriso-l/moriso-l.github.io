<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI伴侣-极简测试</title>
    <style>
        body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 1rem; background: #f5f5f5; }
        .chat-box { background: white; border-radius: 16px; padding: 1rem; height: 400px; overflow-y: auto; margin-bottom: 1rem; }
        .message { margin: 8px 0; padding: 8px 12px; border-radius: 20px; max-width: 80%; }
        .user { background: #007AFF; color: white; align-self: flex-end; margin-left: auto; }
        .assistant { background: #e5e5ea; color: black; }
        .input-area { display: flex; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 40px; border: 1px solid #ccc; }
        button { padding: 12px 24px; border-radius: 40px; background: #007AFF; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🧪 极简测试（无历史记录）</h2>
    <div class="chat-box" id="chatMessages"></div>
    <div class="input-area">
        <input type="text" id="inputMsg" placeholder="输入消息...">
        <button id="sendBtn">发送</button>
    </div>

<script>
    // ⚠️ 请把下面的 sk-xxxx 替换成你自己的完整 API Key
    const API_KEY = 'sk-ffe3087361bc4d659752037a8898e385';
    const API_URL = 'https://api.deepseek.com/v1/chat/completions';

    const messages = [];

    function addMessage(role, content) {
        messages.push({ role, content });
        renderMessages();
    }

    function renderMessages() {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = `message ${msg.role}`;
            div.innerText = msg.content;
            container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
    }

    async function send() {
        const input = document.getElementById('inputMsg');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        addMessage('user', text);

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${API_KEY}`
                },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: messages,
                    max_tokens: 512
                })
            });
            const data = await response.json();
            const reply = data.choices[0].message.content;
            addMessage('assistant', reply);
        } catch (error) {
            addMessage('assistant', '❌ 请求失败：' + error.message);
        }
    }

    document.getElementById('sendBtn').addEventListener('click', send);
    document.getElementById('inputMsg').addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
